name: Update fork version

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-version-main
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update canonical version
        env:
          VERSION_COMMAND: ${{ github.event_name == 'pull_request' && 'increment' || 'sync' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          LATEST_UPSTREAM_VERSION=$(
            git ls-remote --tags --refs https://github.com/usekaneo/kaneo.git \
              | sed 's#refs/tags/v\{0,1\}##' \
              | awk '{print $2}' \
              | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | sort -V \
              | tail -n 1
          )
          test -n "$LATEST_UPSTREAM_VERSION"
          readonly LATEST_UPSTREAM_VERSION

          if test "$VERSION_COMMAND" = "increment"; then
            test -n "$PR_NUMBER"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git switch --force-create version-update origin/main

            if test "$VERSION_COMMAND" = "increment"; then
              PR_MARKER="Fork-Version-PR: $PR_NUMBER"
              if test -n "$(git log origin/main --format=%H --grep="^$PR_MARKER$" -n 1)"; then
                echo "Pull request #$PR_NUMBER was already included in the fork version."
                exit 0
              fi
            fi

            node scripts/versioning.mjs "$VERSION_COMMAND" --latest-upstream "$LATEST_UPSTREAM_VERSION"
            node scripts/versioning.mjs check

            if git diff --quiet -- package.json charts/kaneo/Chart.yaml; then
              echo "Version is already current."
              exit 0
            fi

            git add package.json charts/kaneo/Chart.yaml
            if test "$VERSION_COMMAND" = "increment"; then
              git commit -m "chore(version): update fork version" -m "$PR_MARKER"
            else
              git commit -m "chore(version): update fork version"
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying from origin/main ($attempt/5)."
          done

          echo "Unable to update main after 5 attempts." >&2
          exit 1
