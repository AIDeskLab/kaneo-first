name: Update fork version

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Exact stable upstream version/tag used for the selective sync
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fork-version-main
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Increment fork version or record an explicit upstream sync
        env:
          VERSION_COMMAND: ${{ github.event_name == 'pull_request' && 'increment' || 'sync' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          UPSTREAM_VERSION: ${{ github.event.inputs.upstream_version || '' }}
        run: |
          set -euo pipefail

          if test "$VERSION_COMMAND" = "increment"; then
            test -n "$PR_NUMBER"
          else
            test -n "$UPSTREAM_VERSION"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git switch --force-create version-update origin/main

            if test "$VERSION_COMMAND" = "increment"; then
              PR_MARKER="Fork-Version-PR: $PR_NUMBER"
              if test -n "$(git log origin/main --format=%H --grep="^$PR_MARKER$" -n 1)"; then
                echo "Pull request #$PR_NUMBER was already included in the fork version."
                exit 0
              fi
            fi

            if test "$VERSION_COMMAND" = "increment"; then
              node scripts/versioning.mjs increment
            else
              node scripts/versioning.mjs sync --upstream-version "$UPSTREAM_VERSION"
            fi
            node scripts/versioning.mjs check

            if git diff --quiet -- package.json charts/kaneo/Chart.yaml; then
              echo "Version is already current."
              exit 0
            fi

            git add package.json charts/kaneo/Chart.yaml
            if test "$VERSION_COMMAND" = "increment"; then
              git commit -m "chore(version): update fork version" -m "$PR_MARKER"
            else
              git commit -m "chore(version): update fork version"
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying from origin/main ($attempt/5)."
          done

          echo "Unable to update main after 5 attempts." >&2
          exit 1
