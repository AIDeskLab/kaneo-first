name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Canonical version to release (must match package.json; empty uses current)"
        required: false
        type: string

concurrency:
  group: fork-version-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Enforce dispatch from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release.yml must be dispatched from main (current ref: $GITHUB_REF)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install changelog tooling
        run: |
          bun add -g conventional-changelog-cli
          bun add -g conventional-changelog-angular

      - name: Validate and resolve canonical version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node scripts/versioning.mjs check
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$VERSION" ]; then
            echo "::error::Requested version $REQUESTED_VERSION does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: bunx conventional-changelog -p angular -i CHANGELOG.md -s --release-count 1

      - name: Create release commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${VERSION} [skip ci]"
          fi
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: true

      - name: Trigger Docker Build
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker.yml',
              ref: 'main',
              inputs: {
                version: '${{ steps.version.outputs.version }}',
                latest: 'true'
              }
            });
            console.log('Triggered Docker build for version ${{ steps.version.outputs.version }}');
